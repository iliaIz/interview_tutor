services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8091}:5000"
    environment:
      - PORT=5000
      - GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL:-gemini-smart}
      - GEMINI_FAST_MODEL=${GEMINI_FAST_MODEL:-gemini-fast}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-live-v2}
      - GEMINI_LIVE_PREVIEW_MODEL=${GEMINI_LIVE_PREVIEW_MODEL:-gemini-live-v3}
      - GEMINI_TTS_MODEL=${GEMINI_TTS_MODEL:-gemini-tts-v3}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-${LITELLM_PROXY_URL:-http://host.docker.internal:4000/v1}}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-1234}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://host.docker.internal:7880}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret_livekit_interview_gemini_2026_proxy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
      - ./json:/app/json:ro
      - ./scenarios:/app/scenarios:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
