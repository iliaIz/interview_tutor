name: Production CI/CD (SOTA 2026)

on:
  push:
    branches:
      - main
      - feat/wave-14-gemini-3-8-live-native
      - feat/wave-14-clean-native-voice
      - feat/wave-14-practice-clean-native-voice
      - feat/wave-14-intellij-bridge-live-code-sync
      - feat/wave-16-refactoring-arena-voice-review
      - feat/wave-19-neural-audio-filtering
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate & Invariant Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            shared/package-lock.json

      - name: Install & Build Shared Package
        run: |
          npm --prefix shared ci
          npm --prefix shared run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Prompt Invariant & Anti-Sycophancy Tests
        working-directory: backend
        run: npm run test:prompts

      - name: Run Acoustic Fixture & Resampler Unit Tests
        working-directory: backend
        run: npm run test:vad:unit

      - name: Run Realtime Audio Pacer Tests
        working-directory: backend
        run: npm run test:vad:pacer

      - name: Run Auto-VAD & Gemini Live Fault-Injection Tests (10 Invariant Suites)
        working-directory: backend
        run: npm run test:vad:fault-injection

      - name: Run Headless Acoustic Loopback Resilience Tests
        working-directory: backend
        run: npm run test:vad:loopback

      - name: Run Deterministic Voice Observability & Telemetry Tests
        working-directory: backend
        run: |
          npm run test:telemetry:engine
          npm run test:telemetry:playout
          npm run test:telemetry:db
          npm run test:telemetry:router
          npm run test:telemetry:diagnostics

      - name: Verify Backend TypeScript Build
        working-directory: backend
        run: npm run build

      - name: Run Live Tool & Silence Clarification Isolation Tests
        working-directory: backend
        run: npm run test:live:tool-isolation

      - name: Build Java Sandbox Runner
        working-directory: backend
        run: npm run build:sandbox

      - name: Run Practice LLD Resilience & Fault-Injection Tests
        working-directory: backend
        run: npm run test:practice:resilience

      - name: Run Practice Task Codes & Catalog Integrity Tests
        working-directory: backend
        run: npm run test:practice:task-codes

      - name: Run Mutation Challenges Catalog & Zero-Stillborn Integrity Tests
        working-directory: backend
        run: npm run test:practice:mutation-challenges

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Web Audio & Playout Contract Tests
        working-directory: frontend
        run: npm run test:audio-contracts

      - name: Verify Frontend Production Build
        working-directory: frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

  build-backend:
    name: Build & Push Backend Image
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-backend:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend-v2
          cache-to: type=gha,mode=min,scope=backend-v2

  build-frontend:
    name: Build & Push Frontend Image (Host Prebuild)
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            shared/package-lock.json

      - name: Install & Build Shared Package
        run: |
          npm --prefix shared ci
          npm --prefix shared run build

      - name: Build Frontend SPA (Native Bare-Metal)
        working-directory: frontend
        env:
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-frontend:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend-v2
          cache-to: type=gha,mode=min,scope=frontend-v2

  build-sandbox:
    name: Build & Push Sandbox Image
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Sandbox Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sandbox/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-sandbox:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-sandbox:${{ github.sha }}
          cache-from: type=gha,scope=sandbox-v2
          cache-to: type=gha,mode=min,scope=sandbox-v2

  deploy-vps:
    name: Deploy to VPS via SSH & Verify
    needs: [build-backend, build-frontend, build-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 10m
          timeout: 60s
          envs: GITHUB_ACTOR,GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_SHA
          script: |
            set -e
            trap 'docker rm -f interview-backend-canary 2>/dev/null || true' EXIT

            echo "[1/5] Authenticating with GHCR on VPS..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            cd /home/djelu/projects/interview_tutor

            curl -s -f -H "Authorization: token $GITHUB_TOKEN" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/docker-compose.prod.yml" -o /home/djelu/projects/interview_tutor/docker-compose.prod.yml || true

            echo "[3/5] Exporting deployment metadata & Pulling images..."
            OWNER_LOWER=$(echo "${GITHUB_REPOSITORY%/*}" | tr '[:upper:]' '[:lower:]')
            export GIT_COMMIT_SHA="$GITHUB_SHA"
            export BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/interview_tutor-backend:${GITHUB_SHA}"
            export FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/interview_tutor-frontend:${GITHUB_SHA}"
            export SANDBOX_IMAGE="ghcr.io/${OWNER_LOWER}/interview_tutor-sandbox:${GITHUB_SHA}"
            docker compose -f docker-compose.prod.yml pull

            echo "[4/5] Running Pre-Flight Canary Auto-VAD Verification on VPS..."
            OWNER_LOWER=$(echo "${GITHUB_REPOSITORY%/*}" | tr '[:upper:]' '[:lower:]')
            CANARY_IMAGE="ghcr.io/${OWNER_LOWER}/interview_tutor-backend:${GITHUB_SHA}"

            docker rm -f interview-backend-canary 2>/dev/null || true

            mkdir -p /home/djelu/projects/interview_tutor/data/audio_fixtures
            echo "Starting ephemeral canary container on internal port 5005..."
            docker run -d \
              --name interview-backend-canary \
              --network litellm_shared_network \
              -v /home/djelu/projects/interview_tutor/data/audio_fixtures:/app/tests/fixtures/audio \
              --env-file /home/djelu/projects/interview_tutor/.env \
              -e NODE_ENV=production \
              -e PORT=5005 \
              -e BACKEND_PORT=5005 \
              -e TEST_BACKEND_HOST=localhost:5005 \
              -e GIT_COMMIT_SHA="${GITHUB_SHA}" \
              -e LITELLM_BASE_URL=http://litellm-gateway:4000/v1 \
              "$CANARY_IMAGE"

            echo "Waiting for canary container to initialize..."
            CANARY_READY=false
            for i in $(seq 1 12); do
              if docker exec interview-backend-canary curl -s -f http://localhost:5005/api/health > /dev/null 2>&1; then
                CANARY_READY=true
                break
              fi
              echo "Canary initializing ($i/12), retrying in 2s..."
              sleep 2
            done

            if [ "$CANARY_READY" != "true" ]; then
              echo "❌ Canary server failed healthcheck on port 5005! Capturing logs..."
              docker logs interview-backend-canary --tail 50
              docker rm -f interview-backend-canary || true
              echo "Deployment aborted! Production container was NOT touched."
              exit 1
            fi

            echo "Running SOTA Dual-Engine Pre-Flight Canary Verification (v3 + thinking-v3)..."
            CANARY_PASSED=false
            if docker exec interview-backend-canary node dist/scripts/runAcousticVadMatrix.js --suite=canary; then
              CANARY_PASSED=true
            else
              echo "⚠️ First canary attempt encountered a transient rate/network stall. Waiting 10s for Google GFE socket drain and retrying..."
              sleep 10
              if docker exec interview-backend-canary node dist/scripts/runAcousticVadMatrix.js --suite=canary; then
                CANARY_PASSED=true
              fi
            fi

            if [ "$CANARY_PASSED" != "true" ]; then
              echo "❌ Canary Dual-Engine Verification FAILED! Capturing container logs..."
              docker logs interview-backend-canary --tail 80
              docker rm -f interview-backend-canary || true
              echo "Deployment aborted! Production container was NOT touched."
              exit 1
            fi

            echo "Running SOTA Fault-Injection & Dead-Air Resilience Tests in Canary..."
            if ! docker exec interview-backend-canary node dist/testing/testVadFaultInjection.js; then
              echo "❌ Canary Fault-Injection Verification FAILED! Capturing container logs..."
              docker logs interview-backend-canary --tail 80
              docker rm -f interview-backend-canary || true
              echo "Deployment aborted! Production container was NOT touched."
              exit 1
            fi

            echo "✅ Pre-Flight Canary Auto-VAD Verification PASSED! Cleaning up canary..."
            docker rm -f interview-backend-canary || true

            echo "[5/5] Recreating production containers with zero downtime..."
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/interview_tutor-backend:${GITHUB_SHA}" \
            FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/interview_tutor-frontend:${GITHUB_SHA}" \
            SANDBOX_IMAGE="ghcr.io/${OWNER_LOWER}/interview_tutor-sandbox:${GITHUB_SHA}" \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[Clean] Housekeeping dangling image layers..."
            docker image prune -af --filter "until=72h" || true
            docker logout ghcr.io || true

      - name: Verify Public Health & AI Gateway Readiness
        run: |
          echo "Waiting 8s for containers to initialize..."
          sleep 8
          RESPONSE=$(curl -s -L -f --retry 5 --retry-delay 3 --retry-connrefused https://java.djelu.site/api/health)
          echo "Healthcheck Response: $RESPONSE"
          echo "$RESPONSE" | grep '"status":"ready"' || (echo "Healthcheck failed!" && exit 1)
          echo "🎉 Production deployment verified successfully on https://java.djelu.site!"
