name: Production CI/CD (SOTA 2026)

on:
  push:
    branches:
      - main
      - fix/voice-dialogue-sota-hardening
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build OCI Images & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-backend:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Caddy with Embedded Frontend SPA
      - name: Build and Push Caddy Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.caddy
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-caddy:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-caddy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push Isolated Java 21 Sandbox
      - name: Build and Push Sandbox Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sandbox/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-sandbox:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS via SSH & Verify
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          envs: GITHUB_ACTOR,GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_SHA
          script: |
            set -e
            echo "[1/4] Authenticating with GHCR on VPS..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            cd /home/djelu/spring

            echo "[2/4] Syncing production docker-compose.prod.yml..."
            curl -s -f -H "Authorization: token $GITHUB_TOKEN" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/docker-compose.prod.yml" -o /home/djelu/spring/docker-compose.prod.yml || true

            echo "[3/4] Pulling latest production images from GHCR..."
            docker compose -f docker-compose.prod.yml pull

            echo "[4/4] Recreating containers with zero downtime..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[Clean] Housekeeping dangling image layers..."
            docker image prune -af --filter "until=72h" || true
            docker logout ghcr.io || true

      - name: Verify Public Health & AI Gateway Readiness
        run: |
          echo "Waiting 8s for containers to initialize..."
          sleep 8
          RESPONSE=$(curl -s -f --retry 5 --retry-delay 3 --retry-connrefused https://djelu.site/api/health)
          echo "Healthcheck Response: $RESPONSE"
          echo "$RESPONSE" | grep '"status":"ready"' || (echo "Healthcheck failed!" && exit 1)
          echo "🎉 Production deployment verified successfully on https://djelu.site!"
