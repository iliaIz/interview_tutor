name: Production CI/CD (SOTA 2026)

on:
  push:
    branches:
      - main
      - feat/gemini-3.8-live-extended-thinking
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-backend:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-caddy:
    name: Build & Push Caddy Image (Host Prebuild)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            shared/package-lock.json

      - name: Install & Build Shared Package
        run: |
          npm --prefix shared ci
          npm --prefix shared run build

      - name: Build Frontend SPA (Native Bare-Metal)
        working-directory: frontend
        env:
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Caddy Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.caddy
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-caddy:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  build-sandbox:
    name: Build & Push Sandbox Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Lowercase Image Prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Sandbox Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sandbox/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/interview_tutor-sandbox:latest
            ${{ env.IMAGE_PREFIX }}/interview_tutor-sandbox:${{ github.sha }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

  deploy-vps:
    name: Deploy to VPS via SSH & Verify
    needs: [build-backend, build-caddy, build-sandbox]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          envs: GITHUB_ACTOR,GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_SHA
          script: |
            set -e
            echo "[1/4] Authenticating with GHCR on VPS..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            cd /home/djelu/spring

            echo "[2/4] Syncing production docker-compose.prod.yml & Caddyfile..."
            curl -s -f -H "Authorization: token $GITHUB_TOKEN" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/docker-compose.prod.yml" -o /home/djelu/spring/docker-compose.prod.yml || true
            curl -s -f -H "Authorization: token $GITHUB_TOKEN" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/Caddyfile" -o /home/djelu/spring/Caddyfile || true

            echo "[3/4] Exporting deployment metadata & Pulling images..."
            export GIT_COMMIT_SHA="$GITHUB_SHA"
            docker compose -f docker-compose.prod.yml pull

            echo "[4/4] Recreating containers with zero downtime..."
            GIT_COMMIT_SHA="$GITHUB_SHA" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[Clean] Housekeeping dangling image layers..."
            docker image prune -af --filter "until=72h" || true
            docker logout ghcr.io || true

      - name: Verify Public Health & AI Gateway Readiness
        run: |
          echo "Waiting 8s for containers to initialize..."
          sleep 8
          RESPONSE=$(curl -s -L -f --retry 5 --retry-delay 3 --retry-connrefused https://java.djelu.site/api/health)
          echo "Healthcheck Response: $RESPONSE"
          echo "$RESPONSE" | grep '"status":"ready"' || (echo "Healthcheck failed!" && exit 1)
          echo "🎉 Production deployment verified successfully on https://java.djelu.site!"
