services:
  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/iliaiz/interview_tutor-caddy:latest}
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: interview-caddy-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_internal_net
      - mail-network
      - litellm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/iliaiz/interview_tutor-backend:latest}
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: interview-backend-api
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-latest}
      - LITELLM_BASE_URL=http://litellm-gateway:4000/v1
      - SANDBOX_DAEMON_HOST=interview-sandbox
      - SANDBOX_DAEMON_PORT=8099
      - GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL:-gemini-smart}
      - GEMINI_FAST_MODEL=${GEMINI_FAST_MODEL:-gemini-fast}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-live-v2}
      - GEMINI_LIVE_PREVIEW_MODEL=${GEMINI_LIVE_PREVIEW_MODEL:-gemini-live-v3}
      - GEMINI_TTS_MODEL=${GEMINI_TTS_MODEL:-gemini-tts-v3}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-litellm-local-proxy-master-key-12345}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./json:/app/json:ro
    networks:
      - app_internal_net
      - litellm_net
      - sandbox_internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    depends_on:
      - sandbox

  sandbox:
    image: ${SANDBOX_IMAGE:-ghcr.io/iliaiz/interview_tutor-sandbox:latest}
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: interview-sandbox
    restart: unless-stopped
    expose:
      - "8099"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:exec,size=32M
    mem_limit: 384m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8099 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - sandbox_internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_internal_net:
    driver: bridge
  sandbox_internal_net:
    driver: bridge
    internal: true
  litellm_net:
    name: litellm_shared_network
    external: true
  mail-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
